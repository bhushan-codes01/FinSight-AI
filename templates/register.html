<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
    <script>
      // Apply theme preference instantly before loading DOM
      if (localStorage.getItem('theme-pref') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    </script>
  </head>
  <body class="auth-body">
    <script>
      if (localStorage.getItem('theme-pref') === 'light') {
        document.body.classList.add('theme-light');
      } else if (localStorage.getItem('theme-pref') === 'dark') {
        document.body.classList.remove('theme-light');
      }
    </script>
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4">
        <div class="card-body p-5">
          <h2 class="text-white mb-4">Register</h2>

          <!-- Alert Container for Dynamic Firebase Messages -->
          <div id="auth-alert" class="alert d-none alert-dismissible fade show" role="alert">
            <span id="auth-alert-message"></span>
            <button type="button" class="btn-close" onclick="document.getElementById('auth-alert').classList.add('d-none')" aria-label="Close"></button>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% endwith %}

          <form id="register-form">
            <div class="mb-3">
              <label for="name" class="form-label text-white">Name</label>
              <input type="text" class="form-control form-control-dark" id="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label text-white">Email</label>
              <input type="email" class="form-control form-control-dark" id="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label text-white">Password</label>
              <input type="password" class="form-control form-control-dark" id="password" required />
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label text-white">Confirm Password</label>
              <input type="password" class="form-control form-control-dark" id="confirm_password" required />
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2">Create Account</button>
           </form>

           <!-- OR separator -->
           <div class="d-flex align-items-center my-4">
             <hr class="flex-grow-1 border-secondary m-0">
             <span class="mx-3 text-muted" style="font-size: 0.85rem; font-weight: 500;">OR</span>
             <hr class="flex-grow-1 border-secondary m-0">
           </div>

           <!-- Google Signup Button -->
           <button type="button" id="google-signup-btn" class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2 mb-3 py-2" style="border-radius: 8px; font-weight: 500; border-color: var(--border); background-color: transparent; color: #fff;">
             <svg width="18" height="18" viewBox="0 0 18 18">
               <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.8 2.72v2.24h2.9c1.7-1.57 2.7-3.88 2.7-6.6z"/>
               <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.9-2.24c-.8.54-1.84.87-3.06.87-2.35 0-4.34-1.58-5.05-3.72H.95v2.3C2.43 15.89 5.5 18 9 18z"/>
               <path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.12-.28-1.7s.1-1.16.28-1.7V5H.95A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.95 4l3-2.3z"/>
               <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.1C13.46.66 11.42 0 9 0 5.5 0 2.43 2.11.95 5.1l3 2.3c.71-2.13 2.7-3.72 5-3.72z"/>
             </svg>
             Continue with Google
           </button>
           
           <p class="text-center text-muted mt-4 mb-0">Already have an account? <a href="/login">Login</a></p>
        </div>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
      // Global configuration injected from Flask
      const firebaseConfig = {{ firebase_config | tojson }};
      
      // Initialize Firebase
      if (firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
      } else {
        console.error("Firebase config is missing from env!");
      }

      // Automatically sign out of Firebase on page load to reset state
      firebase.auth().signOut().catch(() => {});

      const authAlert = document.getElementById('auth-alert');
      const authAlertMessage = document.getElementById('auth-alert-message');

      function showAlert(message, type = 'danger') {
        authAlert.className = `alert alert-${type} alert-dismissible fade show`;
        authAlertMessage.textContent = message;
      }

      async function sendTokenToBackend(token) {
        try {
          const response = await fetch('/login-firebase', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ idToken: token })
          });
          const data = await response.json();
          if (data.success) {
            window.location.href = data.redirect || '/dashboard';
          } else {
            showAlert(data.error || "Authentication failed on the server.", "danger");
            await firebase.auth().signOut();
          }
        } catch (error) {
          console.error(error);
          showAlert("Failed to connect to the server. Please check your network and try again.", "danger");
          await firebase.auth().signOut();
        }
      }

      // Email/Password registration
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const submitBtn = document.getElementById('submit-btn');

        if (password !== confirmPassword) {
          showAlert("Passwords do not match.", "danger");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account...';
        authAlert.classList.add('d-none');

        try {
          const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
          // Set display name in Firebase user profile
          await result.user.updateProfile({ displayName: name });
          const token = await result.user.getIdToken();
          await sendTokenToBackend(token);
        } catch (error) {
          console.error(error);
          showAlert(error.message, "danger");
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });

      // Google Sign-In popup
      document.getElementById('google-signup-btn').addEventListener('click', async () => {
        authAlert.classList.add('d-none');
        const provider = new firebase.auth.GoogleAuthProvider();
        
        provider.setCustomParameters({
          prompt: 'select_account'
        });

        try {
          const result = await firebase.auth().signInWithPopup(provider);
          const token = await result.user.getIdToken();
          await sendTokenToBackend(token);
        } catch (error) {
          console.error(error);
          showAlert(error.message, "danger");
        }
      });
    </script>
  </body>
</html>
