<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
    <script>
      // Apply theme preference instantly before loading DOM
      if (localStorage.getItem('theme-pref') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    </script>
  </head>
  <body class="auth-body">
    <script>
      if (localStorage.getItem('theme-pref') === 'light') {
        document.body.classList.add('theme-light');
      } else if (localStorage.getItem('theme-pref') === 'dark') {
        document.body.classList.remove('theme-light');
      }
    </script>
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4" style="max-width: 450px; margin: auto;">
        <div class="card-body p-5">
          <h2 class="text-white mb-3">Reset Password</h2>
          <p class="text-muted small mb-4">Please choose a strong new password below.</p>
          
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% endwith %}

          <form method="POST" action="/reset-password/{{ token }}">
            <div class="mb-3">
              <label for="password" class="form-label text-white">New Password</label>
              <input type="password" class="form-control form-control-dark" id="password" name="password" required />
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label text-white">Confirm New Password</label>
              <input type="password" class="form-control form-control-dark" id="confirm_password" name="confirm_password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Update Password</button>
          </form>
        </div>
      </div>
    </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
