<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
    <script>
      // Apply theme preference instantly before loading DOM
      if (localStorage.getItem('theme-pref') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    </script>
  </head>
  <body class="auth-body">
    <script>
      if (localStorage.getItem('theme-pref') === 'light') {
        document.body.classList.add('theme-light');
      } else if (localStorage.getItem('theme-pref') === 'dark') {
        document.body.classList.remove('theme-light');
      }
    </script>
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4" style="max-width: 450px; margin: auto;">
        <div class="card-body p-5">
          <h2 class="text-white mb-3">Forgot Password</h2>
          <p class="text-muted small mb-4">Enter your email address and we'll send you a link to reset your password.</p>
          
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% endwith %}

          <form method="POST" action="/forgot-password">
            <div class="mb-4">
              <label for="email" class="form-label text-white">Email Address</label>
              <input type="email" class="form-control form-control-dark" id="email" name="email" required placeholder="name@example.com" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
          </form>
          <p class="text-center text-muted mt-4 mb-0">Remember your password? <a href="/login">Login</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
