<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4 text-center" style="max-width: 480px; margin: auto;">
        <div class="card-body p-5">
          <div class="mb-4">
            <span style="font-size: 3rem;">✉️</span>
          </div>
          <h2 class="text-white mb-3">Check Your Email</h2>
          <p class="text-muted mb-4">
            We've sent a verification link to <strong class="text-white">{{ email }}</strong>. 
            Please click on the link in the email to activate your account.
          </p>
          <div class="mb-4">
            <a href="/login" class="btn btn-primary w-100">Back to Login</a>
          </div>
          <p class="text-muted small mb-0">
            Didn't receive the email? Check your spam folder or wait a couple of minutes.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
