<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgets - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Finance Tracker</a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
            <li class="nav-item"><a class="nav-link" href="/chatbot">Chatbot</a></li>
          </ul>
        </div>
        <form method="POST" action="/logout" class="d-inline">
          <button class="btn btn-outline-light">Logout</button>
        </form>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-12">
          <div class="card bg-dark border-0 shadow-sm p-4">
            <h1 class="h4 text-white mb-3">Budgets</h1>
            <p class="text-muted mb-0">Create monthly category budgets and track remaining balance.</p>
          </div>
        </div>

        <div class="col-12">
          <div class="card border-0 shadow-sm p-4 mb-4">
            <form method="POST" action="/budgets" class="row g-3">
              <div class="col-md-4">
                <label class="form-label text-white">Category</label>
                <input name="category" type="text" class="form-control form-control-dark" required />
              </div>
              <div class="col-md-4">
                <label class="form-label text-white">Amount</label>
                <input name="budget_amount" type="number" step="0.01" class="form-control form-control-dark" required />
              </div>
              <div class="col-md-4">
                <label class="form-label text-white">Month</label>
                <input name="month" type="month" class="form-control form-control-dark" required />
              </div>
              <div class="col-12 text-end">
                <button class="btn btn-success">Save Budget</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-12">
          <div class="card border-0 shadow-sm p-4">
            <div class="row g-3">
              {% for budget in budgets %}
              <div class="col-md-6">
                <div class="card budget-card bg-secondary bg-opacity-10 border-0 p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="text-white mb-0">{{ budget.category }}</h6>
                    <span class="badge bg-light text-dark">{{ budget.month }}</span>
                  </div>
                  <p class="mb-2 text-muted">Budgeted ${{ budget.budget_amount }}</p>
                </div>
              </div>
              {% else %}
              <div class="col-12 text-center text-muted">No budget rules added yet.</div>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
