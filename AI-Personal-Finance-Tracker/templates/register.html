<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4">
        <div class="card-body p-5">
          <h2 class="text-white mb-4">Register</h2>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% endwith %}

          <form method="POST" action="/register">
            <div class="mb-3">
              <label for="name" class="form-label text-white">Name</label>
              <input type="text" class="form-control form-control-dark" id="name" name="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label text-white">Email</label>
              <input type="email" class="form-control form-control-dark" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label text-white">Password</label>
              <input type="password" class="form-control form-control-dark" id="password" name="password" required />
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label text-white">Confirm Password</label>
              <input type="password" class="form-control form-control-dark" id="confirm_password" name="confirm_password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
          </form>
          <p class="text-center text-muted mt-4">Already have an account? <a href="/login">Login</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
