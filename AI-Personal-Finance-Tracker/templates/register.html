<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="container py-5">
      <div class="card auth-card shadow-lg rounded-4">
        <div class="card-body p-5">
          <h2 class="text-white mb-4">Register</h2>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% endwith %}

          <form method="POST" action="/register">
            <div class="mb-3">
              <label for="name" class="form-label text-white">Name</label>
              <input type="text" class="form-control form-control-dark" id="name" name="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label text-white">Email</label>
              <input type="email" class="form-control form-control-dark" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label text-white">Password</label>
              <input type="password" class="form-control form-control-dark" id="password" name="password" required />
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label text-white">Confirm Password</label>
              <input type="password" class="form-control form-control-dark" id="confirm_password" name="confirm_password" required />
             <button type="submit" class="btn btn-primary w-100">Create Account</button>
           </form>
           
           <div class="d-flex align-items-center my-4">
             <hr class="flex-grow-1 border-secondary" style="opacity: 0.25;" />
             <span class="mx-3 text-muted small">or</span>
             <hr class="flex-grow-1 border-secondary" style="opacity: 0.25;" />
           </div>
           
           <a href="/auth/google" class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2">
             <svg width="18" height="18" viewBox="0 0 18 18">
               <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.84 2.07-1.8 2.7v2.24h2.91c1.7-1.56 2.69-3.86 2.69-6.57z"/>
               <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.24c-.8.54-1.84.87-3.05.87-2.35 0-4.33-1.59-5.04-3.72H.95v2.3C2.43 15.89 5.48 18 9 18z"/>
               <path fill="#FBBC05" d="M3.96 10.73A5.4 5.4 0 0 1 3.6 9c0-.6.1-1.18.27-1.73V4.97H.95A8.99 8.99 0 0 0 0 9c0 1.48.36 2.88.95 4.13l3.01-2.4z"/>
               <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.8 11.43 0 9 0 5.48 0 2.43 2.11.95 5.07l3.01 2.3A5.4 5.4 0 0 1 9 3.58z"/>
             </svg>
             Continue with Google
           </a>
           
           <p class="text-center text-muted mt-4">Already have an account? <a href="/login">Login</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
