<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Finance Tracker</a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
            <li class="nav-item"><a class="nav-link" href="/budgets">Budgets</a></li>
          </ul>
        </div>
        <form method="POST" action="/logout" class="d-inline">
          <button class="btn btn-outline-light">Logout</button>
        </form>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card chat-card border-0 shadow-sm p-4">
            <h2 class="text-white mb-3">Financial AI Assistant</h2>
            <div class="chat-window mb-4" id="chatWindow"></div>
            <form id="chatForm" class="row g-3">
              <div class="col-12">
                <textarea id="userQuestion" class="form-control form-control-dark" rows="3" placeholder="Ask your financial assistant about spending, budgets, or savings opportunities"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label text-white">Upload CSV (Optional)</label>
                <input type="file" id="statementFile" class="form-control form-control-dark" accept=".csv" />
              </div>
              <div class="col-md-6 text-end align-self-end">
                <button type="submit" class="btn btn-primary w-100">Submit Question</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/js/chat.js"></script>
  </body>
</html>
